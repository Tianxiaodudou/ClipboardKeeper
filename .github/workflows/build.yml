name: Build & Release

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          read_prop() { grep -E "^$1=" version.properties | head -1 | cut -d= -f2 | tr -d '[:space:]'; }
          VC="$(read_prop versionCode)"
          VN="$(read_prop versionName)"
          if git rev-parse -q --verify "refs/tags/v${VN}" >/dev/null 2>&1; then
            IFS=. read -r A B C <<< "${VN}"
            C=$((C+1))
            if [ "${C}" -gt 9 ]; then C=0; B=$((B+1)); fi
            if [ "${B}" -gt 9 ]; then B=0; A=$((A+1)); fi
            VN="${A}.${B}.${C}"
            VC=$((VC+1))
          fi
          echo "VN=${VN}" >> "$GITHUB_OUTPUT"
          echo "VC=${VC}" >> "$GITHUB_OUTPUT"
          echo "resolved version ${VN} (${VC})"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 未配置，本次使用 debug 签名"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/ks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ks/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/ks/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease \
            -PversionCodeOverride=${{ steps.version.outputs.VC }} \
            -PversionNameOverride=${{ steps.version.outputs.VN }} 2>&1 | tee build.log

      - name: Package artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          cp "$SRC" "dist/${{ steps.version.outputs.VN }}-ClipboardPolice.apk"
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardPolice-${{ steps.version.outputs.VN }}
          path: dist/*.apk

      - name: Commit version bump
        if: github.ref == 'refs/heads/main' && success()
        run: |
          set -euo pipefail
          printf 'versionCode=%s\nversionName=%s\n' \
            "${{ steps.version.outputs.VC }}" "${{ steps.version.outputs.VN }}" > version.properties
          if git diff --quiet -- version.properties; then
            echo "版本号未变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore(release): v${{ steps.version.outputs.VN }} [skip ci]"
          git push origin HEAD:main

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VN }}
          name: v${{ steps.version.outputs.VN }}
          files: dist/*.apk
          generate_release_notes: true

      - name: Remove keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/ks"

      # 把本次构建结果推到 ci-log 分支，便于在没有 Actions 权限时查结果
      - name: Publish CI result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git fetch origin ci-log 2>/dev/null && git checkout -B ci-log origin/ci-log || git checkout -B ci-log
          mkdir -p ci
          {
            echo "run=${{ github.run_number }}"
            echo "branch=${{ github.ref_name }}"
            echo "version=${{ steps.version.outputs.VN }} (${{ steps.version.outputs.VC }})"
            echo "status=${JOB_STATUS}"
          } > ci/status.txt
          if [ -f build.log ]; then
            tail -c 120000 build.log > ci/build.log
          else
            echo "no build.log produced" > ci/build.log
          fi
          git add -f ci
          git commit -m "ci: build #${{ github.run_number }} ${JOB_STATUS} on ${{ github.ref_name }}" || echo "no changes"
          git push -f origin ci-log
