name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          read_prop() { grep -E "^$1=" version.properties | head -1 | cut -d= -f2 | tr -d '[:space:]'; }
          CUR_CODE="$(read_prop versionCode)"
          CUR_NAME="$(read_prop versionName)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VN="${GITHUB_REF_NAME#v}"
            if [ "${VN}" = "${CUR_NAME}" ]; then
              VC="${CUR_CODE}"
            else
              VC=$((CUR_CODE + 1))
            fi
          else
            VN="$CUR_NAME"
            VC="$CUR_CODE"
          fi
          echo "VN=$VN" >> "$GITHUB_OUTPUT"
          echo "VC=$VC" >> "$GITHUB_OUTPUT"
          echo "resolved version $VN ($VC)"

      - name: Prepare changelog
        run: |
          set -euo pipefail
          if python3 tools/changelog.py CHANGELOG.md "${{ steps.version.outputs.VN }}" > release_body.md; then
            echo "changelog found"
          else
            echo "::error::CHANGELOG.md 里没有 ${{ steps.version.outputs.VN }} 的段落，发版必须先写更新日志"
            exit 1
          fi
          wc -c release_body.md

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::未配置 KEYSTORE_BASE64：发版必须使用固定签名密钥，禁止 debug 签名"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          KS="$RUNNER_TEMP/signing/release.bin"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
          MAGIC=$(head -c 4 "$KS" | od -An -tx1 | tr -d ' \n')
          case "$MAGIC" in
            feedfeed) TYPE=JKS ;;
            *) TYPE=PKCS12 ;;
          esac
          echo "signing: magic=$MAGIC type=$TYPE bytes=$(wc -c < "$KS")"
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "KEYSTORE_TYPE=$TYPE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        id: build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease \
            -PversionCodeOverride=${{ steps.version.outputs.VC }} \
            -PversionNameOverride=${{ steps.version.outputs.VN }} 2>&1 | tee build.log

      - name: Package artifact
        id: pack
        run: |
          set -uo pipefail
          mkdir -p dist
          SRC="$(find app/build/outputs/apk/release -name '*.apk' -print -quit || true)"
          echo "apk source: ${SRC}"
          if [ -z "${SRC}" ]; then echo "no apk produced"; exit 1; fi
          cp "$SRC" "dist/${{ steps.version.outputs.VN }}-ClipboardKeeper.apk"
          ls -l dist

      - name: Verify APK payload
        run: |
          set -uo pipefail
          APK=$(ls dist/*.apk | head -1)
          {
            echo "== APK entries =="
            unzip -l "$APK" | grep -E "META-INF/xposed|classes[0-9]*\.dex|AndroidManifest.xml" || true
            echo "== module.prop =="
            unzip -p "$APK" META-INF/xposed/module.prop || true
            echo "== scope.list =="
            unzip -p "$APK" META-INF/xposed/scope.list || true
            echo "== java_init.list =="
            unzip -p "$APK" META-INF/xposed/java_init.list || true
            echo "== signing =="
          } | tee -a build.log
          APKSIGNER=$(command -v apksigner || true)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | tail -1)
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found, skip signature check"
          elif "$APKSIGNER" verify --print-certs "$APK" >> build.log 2>&1; then
            echo "APK signed OK"
            grep -i "certificate SHA-256" build.log | tail -2 || true
          else
            echo "APK 未签名或签名校验失败，终止"
            exit 1
          fi

      - name: Upload artifact
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardKeeper-${{ steps.version.outputs.VN }}
          path: dist/*.apk

      - name: Create GitHub Release
        if: github.ref_type == 'tag' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "v${{ steps.version.outputs.VN }}" \
            "dist/${{ steps.version.outputs.VN }}-ClipboardKeeper.apk" \
            --title "v${{ steps.version.outputs.VN }}" \
            --notes-file release_body.md

      - name: Remove signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"

      - name: Publish CI result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git fetch origin ci-log 2>/dev/null && git checkout -B ci-log origin/ci-log || git checkout -B ci-log
          mkdir -p ci
          {
            echo "run=${{ github.run_number }}"
            echo "ref=${{ github.ref_name }}"
            echo "version=${{ steps.version.outputs.VN }} (${{ steps.version.outputs.VC }})"
            echo "status=${JOB_STATUS}"
            echo ""
            echo "== step outcomes =="
            echo "build=${{ steps.build.outcome }} pack=${{ steps.pack.outcome }} upload=${{ steps.upload.outcome }}"
            echo "== ls dist =="
            ls -l dist || true
          } > ci/status.txt
          if [ -f build.log ]; then
            tail -c 120000 build.log > ci/build.log
          else
            echo "no build.log produced" > ci/build.log
          fi
          git add -f ci
          git commit -m "ci: run #${{ github.run_number }} ${JOB_STATUS}" || echo "no changes"
          git push -f origin ci-log
