name: Build & Release

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    # 提交信息含 [skip ci] 时跳过（版本递增提交用 GITHUB_TOKEN 推送，本身不会再触发）
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          read_prop() { grep -E "^$1=" version.properties | head -1 | cut -d= -f2 | tr -d '[:space:]'; }
          VC="$(read_prop versionCode)"
          VN="$(read_prop versionName)"
          # 版本是否已发布只看 Release 是否存在（不依赖 git tag，tag 删了也不影响递增）
          CODE="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/v${VN}")" || CODE=""
          echo "release check v${VN} -> HTTP $CODE"
          # 只有确定“该版本还没发过”（404）才沿用当前版本；200 或查询异常(401/403/5xx/空)
          # 都递增，保证版本单调、绝不重复发布同一个版本号
          if [ "$CODE" != "404" ]; then
            IFS=. read -r A B C <<< "${VN}"
            C=$((C+1))
            if [ "${C}" -gt 9 ]; then C=0; B=$((B+1)); fi
            if [ "${B}" -gt 9 ]; then B=0; A=$((A+1)); fi
            VN="${A}.${B}.${C}"
            VC=$((VC+1))
          fi
          echo "VN=${VN}" >> "$GITHUB_OUTPUT"
          echo "VC=${VC}" >> "$GITHUB_OUTPUT"
          echo "resolved version ${VN} (${VC})"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        id: gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check signing key
        run: |
          set -euo pipefail
          if [ -f signing/keystore.properties ] && [ -f signing/clipboardpolice-release.p12 ]; then
            echo "signing: 使用仓库内固定密钥 signing/clipboardpolice-release.p12"
          else
            echo "::error::缺少 signing/ 固定签名密钥：禁止用 debug 签名发布"
            exit 1
          fi


      - name: Build release APK
        id: build
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease \
            -PversionCodeOverride=${{ steps.version.outputs.VC }} \
            -PversionNameOverride=${{ steps.version.outputs.VN }} 2>&1 | tee build.log

      - name: Package artifact
        id: pack
        run: |
          set -uo pipefail
          mkdir -p dist
          SRC="$(find app/build/outputs/apk/release -name '*.apk' -print -quit || true)"
          echo "apk source: ${SRC}"
          find app/build/outputs -name '*.apk' || true
          if [ -z "${SRC}" ]; then echo "no apk produced"; exit 1; fi
          cp "$SRC" "dist/${{ steps.version.outputs.VN }}-ClipboardPolice.apk"
          ls -l dist

      - name: Verify APK payload
        run: |
          set -uo pipefail
          APK=$(ls dist/*.apk | head -1)
          {
            echo "== APK entries =="
            unzip -l "$APK" | grep -E "META-INF/xposed|classes[0-9]*\\.dex|AndroidManifest.xml" || true
            echo "== module.prop =="
            unzip -p "$APK" META-INF/xposed/module.prop || true
            echo "== scope.list =="
            unzip -p "$APK" META-INF/xposed/scope.list || true
            echo "== java_init.list =="
            unzip -p "$APK" META-INF/xposed/java_init.list || true
            echo "== signing =="
          } | tee -a build.log
          APKSIGNER=$(command -v apksigner || true)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | tail -1)
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found, skip signature check"
          elif "$APKSIGNER" verify --print-certs "$APK" >> build.log 2>&1; then
            echo "APK signed OK"
            grep -i "certificate SHA-256" build.log | tail -2 || true
          else
            echo "APK 未签名或签名校验失败，终止"
            exit 1
          fi

      - name: Upload artifact
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardPolice-${{ steps.version.outputs.VN }}
          path: dist/*.apk

      - name: Commit version bump
        if: github.ref == 'refs/heads/main' && success()
        run: |
          set -euo pipefail
          printf 'versionCode=%s\nversionName=%s\n' \
            "${{ steps.version.outputs.VC }}" "${{ steps.version.outputs.VN }}" > version.properties
          if git diff --quiet -- version.properties; then
            echo "版本号未变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore(release): v${{ steps.version.outputs.VN }} [skip ci]"
          git push origin HEAD:main

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VN }}
          name: v${{ steps.version.outputs.VN }}
          files: dist/*.apk
          body: |
            ## 剪贴板警察 ${{ steps.version.outputs.VN }}

            - Hook：ClipboardService 的 setPrimaryClip / getPrimaryClip
            - 作用域：系统框架（system）
            - 目标：Android 14~16 + KernelSU + LSPosed

            > 固定签名：密钥随仓库提供（`signing/`，私有仓库），每次构建都会打印证书 SHA-256 到 `ci-log` 分支的日志。
            > 旧版本 v0.1.0 / v0.1.1 为 debug 签名，若已安装请先卸载再装本版本。


      # 把本次构建结果推到 ci-log 分支，便于在没有 Actions 权限时查结果
      - name: Publish CI result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git fetch origin ci-log 2>/dev/null && git checkout -B ci-log origin/ci-log || git checkout -B ci-log
          mkdir -p ci
          {
            echo "run=${{ github.run_number }}"
            echo "branch=${{ github.ref_name }}"
            echo "version=${{ steps.version.outputs.VN }} (${{ steps.version.outputs.VC }})"
            echo "status=${JOB_STATUS}"
          } > ci/status.txt
          {
            echo "== step outcomes =="
            echo "gradle=${{ steps.gradle.outcome }} build=${{ steps.build.outcome }} pack=${{ steps.pack.outcome }} upload=${{ steps.upload.outcome }}"
            echo "== ls dist =="
            ls -l dist || true
            echo "== apk files =="
            find app/build/outputs -name '*.apk' || true
            echo "== git status =="
            git status --short | head -20
            echo "== run log =="
          } > ci/build.log
          if [ -f build.log ]; then
            tail -c 120000 build.log >> ci/build.log
          else
            echo "no build.log produced" >> ci/build.log
          fi
          git add -f ci
          git commit -m "ci: build #${{ github.run_number }} ${JOB_STATUS} on ${{ github.ref_name }}" || echo "no changes"
          git push -f origin ci-log
