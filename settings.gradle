pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        // android-updater 发布在 GitHub Packages（私有），凭据由 CI 注入
        maven {
            url = uri("https://maven.pkg.github.com/Tianxiaodudou/android-updater")
            credentials {
                username = System.getenv("GITHUB_ACTOR") ?: ""
                password = System.getenv("GITHUB_TOKEN") ?: ""
            }
            content { includeGroup("com.tianxiaodudou") }
        }
    }
}

rootProject.name = "ClipboardKeeper"
include ':app'
