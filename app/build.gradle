plugins {
    id 'com.android.application'
}

def versionProps = new Properties()
rootProject.file('version.properties').withInputStream { versionProps.load(it) }
// CI 可在发布前用 -PversionCodeOverride / -PversionNameOverride 覆盖，避免先提交再构建
def appVersionCode = (project.findProperty('versionCodeOverride')
        ?: versionProps.getProperty('versionCode', '1')).toString().trim().toInteger()
def appVersionName = (project.findProperty('versionNameOverride')
        ?: versionProps.getProperty('versionName', '0.1.0')).toString().trim()

def keystoreFile = System.getenv('KEYSTORE_FILE')

android {
    namespace 'com.tianxiaodudou.clipboardpolice'
    compileSdk 35

    defaultConfig {
        applicationId "com.tianxiaodudou.clipboardpolice"
        minSdk 34
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // CI 注入 keystore 时用 release 签名，否则退回 debug 签名（保证 APK 始终可安装）
            signingConfig keystoreFile ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    // 必须 compileOnly：打进 APK 会使用模块自身副本，导致 Hook 静默失效
    compileOnly 'io.github.libxposed:api:102.0.0'

    implementation 'com.github.topjohnwu.libsu:core:5.2.1'
    // libsu 传递 kotlin-stdlib-jdk7/jdk8 1.6.21，与 kotlin-stdlib 1.8 重复类，统一到 1.8
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
