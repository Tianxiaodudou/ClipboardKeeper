plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def versionProps = new Properties()
rootProject.file('version.properties').withInputStream { versionProps.load(it) }
// CI 可在发布前用 -PversionCodeOverride / -PversionNameOverride 覆盖，避免先提交再构建
def appVersionCode = (project.findProperty('versionCodeOverride')
        ?: versionProps.getProperty('versionCode', '1')).toString().trim().toInteger()
def appVersionName = (project.findProperty('versionNameOverride')
        ?: versionProps.getProperty('versionName', '0.1.0')).toString().trim()

// 签名密钥只来自环境变量（CI 用 GitHub Secrets 注入），仓库内不保存任何密钥文件
def keystoreFile = System.getenv('KEYSTORE_FILE')
def keystoreType = System.getenv('KEYSTORE_TYPE') ?: 'PKCS12'
def keystorePassword = System.getenv('KEYSTORE_PASSWORD')
def keystoreAlias = System.getenv('KEY_ALIAS')
def keystoreKeyPassword = System.getenv('KEY_PASSWORD')

android {
    namespace 'com.tianxiaodudou.clipboardkeeper'
    compileSdk = 37

    defaultConfig {
        applicationId "com.tianxiaodudou.clipboardkeeper"
        minSdk 34
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storeType keystoreType
                storePassword keystorePassword
                keyAlias keystoreAlias
                keyPassword keystoreKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // 只使用固定签名密钥；未提供时产物不签名（CI 会直接拦截，绝不回退 debug 签名）
            signingConfig keystoreFile ? signingConfigs.release : null
            // 开启 R8 混淆 + 资源压缩（Hook 入口与 libsu 的 keep 规则见 proguard-rules.pro）
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    // 必须 compileOnly：打进 APK 会使用模块自身副本，导致 Hook 静默失效
    compileOnly 'io.github.libxposed:api:102.0.0'

    implementation 'com.github.topjohnwu.libsu:core:5.2.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'top.yukonga.miuix.kmp:miuix-ui:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-preference:0.9.4'
    // 检查更新 / 下载 / 安装：自己的 android-updater 库
    implementation 'com.tianxiaodudou:updater:1.2.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
